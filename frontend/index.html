<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RepoChat - Sign in</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-box">
      <div class="brand"><span class="dot"></span> RepoChat</div>
      <h1 id="form-title">Log in</h1>
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email" autocomplete="username" required />
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" minlength="8" required />
        <div class="error" id="error"></div>
        <button type="submit" id="submit-btn">Log in</button>
      </form>
      <div class="toggle-link">
        <span id="toggle-text">Don't have an account?</span>
        <a id="toggle-link">Register</a>
      </div>
    </div>
  </div>

  <script src="/api.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
